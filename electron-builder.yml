appId: com.restrike.mcm
productName: reStrikeMCM
asar: true
files:
  - "out/**/*"
  - "package.json"
  - "!**/*.map"
extraFiles:
  - from: assets
    to: assets
    filter: ["**/*"]
  - from: default-config.json
    to: default-config.json
  - from: docs/runbook.md
    to: runbook.md
directories:
  output: dist
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: reStrikeMCM
  uninstallDisplayName: reStrikeMCM ${version}
  artifactName: ${productName}-${version}-Setup.exe
